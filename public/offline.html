<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kirina Korean 离线</title>
    <style>
      :root {
        --paper: #f3efe5;
        --paper-deep: #e3dccd;
        --ink: #181c1b;
        --muted: #69716d;
        --line: rgba(24, 28, 27, 0.16);
        --surface: rgba(255, 252, 244, 0.9);
        --ocean: #173f73;
        --celadon: #4f8c76;
        --brass: #b7873f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background:
          linear-gradient(90deg, rgba(23, 63, 115, 0.05) 1px, transparent 1px) 0 0 / 42px 42px,
          linear-gradient(180deg, rgba(79, 140, 118, 0.05) 1px, transparent 1px) 0 0 / 42px 42px,
          linear-gradient(135deg, var(--paper), #eef0ea 68%, var(--paper-deep));
        color: var(--ink);
        font-family: "Segoe UI", "Noto Sans KR", "Noto Sans CJK SC", sans-serif;
      }
      main {
        position: relative;
        width: min(34rem, 100%);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 22px 64px rgba(24, 28, 27, 0.12);
      }
      main::before {
        content: "";
        display: block;
        height: 11rem;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(255, 250, 240, 0.16), rgba(23, 63, 115, 0.18)),
          url("/assets/generated/workspace.webp") center / cover;
      }
      section {
        padding: 1.4rem;
      }
      .eyebrow {
        margin: 0;
        color: var(--ocean);
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 900;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.4rem 0 0;
        font-family: Georgia, "Noto Serif KR", "Songti SC", serif;
        font-size: clamp(2rem, 9vw, 3.4rem);
        line-height: 0.98;
      }
      p {
        margin: 1rem 0 0;
        color: var(--muted);
        line-height: 1.75;
      }
      .stamp {
        display: inline-block;
        margin-top: 1rem;
        border: 1px solid rgba(23, 63, 115, 0.22);
        border-radius: 8px;
        background: rgba(23, 63, 115, 0.08);
        padding: 0.45rem 0.65rem;
        color: var(--ocean);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="eyebrow">Offline Study Desk</p>
        <h1>你现在处于离线状态</h1>
        <p>已缓存的页面和本机学习数据仍可使用。网络恢复后刷新一次，Kirina 会继续同步最新资源。</p>
        <span class="stamp">本地进度仍保留</span>
      </section>
    </main>
  </body>
</html>
